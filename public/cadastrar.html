<!DOCTYPE html>
<html>

<body>
    <form id="formCadastro">
        <input id="nome_vendedor" name="nome_vendedor" type="text" required>
        <input id="telefone_vendedor" name="telefone_vendedor" type="text" required>
        <input id="email_vendedor" name="email_vendedor" type="email" required>
        <input id="senha_vendedor" name="senha_vendedor" type="password" required>
        <input id="localidade_vendedor" name="localidade_vendedor" type="text" required>
        <input id="imagem_vendedor" name="imagem_vendedor" type="file" accept="image/*" required>
        <button id="btnCadastrar" type="submit">Cadastrar</button>
    </form>
    <script src="./cadastrar.js"></script>
</body>

</html>
